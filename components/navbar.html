<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
</head>
<body>
    <nav class="navbar">

        <div class="logo-container">
            <img src="../images/cropped_circle.png" alt="Logo" class="logo-img">
            <span class="brand-name">Blood Donors</span>
        </div>   
        
        <button class="menu-toggle" id="menu-toggle" aria-label="open navigation menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav-links" id="nav-links">
            <li><a href="home-page.html" class="active">Home</a></li>
            <li><a href="donar.html">Donor</a></li>
            <li><a href="#">Emergency</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="nav-icons">

              <!-- Notification icon -->
            <div class="notification-container">

                <button class="icon-btn" id="notificationButton"
                        aria-label="Notifications" aria-expanded="false">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification-count">2</span>
                </button>

                <!-- Notification dropdown -->
                <div class="notification-box" id="notificationBox">

                    <h3>Notifications</h3>

                    <a href="chat.html" class="notification-item">
                        <i class="fa-solid fa-comment"></i>
                        <div>
                            <strong>New Message</strong>
                            <p>You received a new message.</p>
                        </div>
                    </a>

                    <a href="chat.html" class="notification-item">
                        <i class="fa-solid fa-comment"></i>
                        <div>
                            <strong>New Message</strong>
                            <p>You have an unread message.</p>
                        </div>
                    </a>

                </div>

            </div>
            <!--notification icon-->
            <a href="#" class="icon-btn"><i class="fa-solid fa-circle-user"></i></a>
        </div>
