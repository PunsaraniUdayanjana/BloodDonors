<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Donor</title>

    <link rel="stylesheet" href="../css/find-donor.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/music-player.css">
    <link rel="stylesheet" href="../css/emergency-request.css">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Common Navbar -->
    <div id="navbar"></div>
    <div id="emergency-popup-container"></div>
    <div id="music-player"></div>

    <section class="container1">

        <div class="headline">
             <h1>
                FIND SUITABLE BLOOD DONORS BY
                BLOOD GROUP AND LOCATION.
                CONNECT WITH DONORS
                WHEN HELP IS NEEDED.
            </h1>
        </div>


        <div class="search-container">

            <h2> Find a Donor</h2>

            <div class="search-form">

                <div class="input-group">

                    <i class="fa-solid fa-droplet"></i>

                    <select id="bloodgroup">
                        <option value="" disabled selected>Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="input-group">

                    <i class="fa-solid fa-location-dot"></i>

                    <select id="location">
                        <option value="" disabled selected>Location</option>
                        <option value="Colombo">Colombo</option>
                        <option value="Gampaha">Gampaha</option>
                        <option value="Kalutara">Kalutara</option>
                        <option value="Kandy">Kandy</option>
                        <option value="Matale">Matale</option>
                        <option value="Nuwara Eliya">Nuwara Eliya</option>
                        <option value="Galle">Galle</option>
                        <option value="Matara">Matara</option>
                        <option value="Hambantota">Hambantota</option>
                        <option value="Kurunegala">Kurunegala</option>
                        <option value="Puttalam">Puttalam</option>
                        <option value="Ratnapura">Ratnapura</option>
                        <option value="Kegalle">Kegalle</option>
                        <option value="Batticaloa">Batticaloa</option>
                        <option value="Ampara">Ampara</option>
                        <option value="Trincomalee">Trincomalee</option>
                        <option value="Anuradhapura">Anuradhapura</option>
                        <option value="Polonnaruwa">Polonnaruwa</option>
                        <option value="Badulla">Badulla</option>
                        <option value="Monaragala">Monaragala</option>
                        <option value="Jaffna">Jaffna</option>
                        <option value="Kilinochchi">Kilinochchi</option>
                        <option value="Mannar">Mannar</option>
                        <option value="Mullaitivu">Mullaitivu</option>
                        <option value="Vavuniya">Vavuniya</option>
                    </select>
                </div>


                <div class="btn-group">
                    <button type="button" class="search-btn">search</button>
                    <button type="button" class="request-btn">request</button>
                </div>

                
            </div>

        </div>


    </section>




    <!-- Home page content goes here -->
    <div id="footer"></div>

    <script src="../js/navbar.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/music-player.js"></script>
    <script src="../js/emergency-request.js"></script>
</body>
</html>
